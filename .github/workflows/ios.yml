name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "ios**"

jobs:
  build-ipa:
    name: Build unsigned IPA (iOS arm64)
    runs-on: macos-15
    timeout-minutes: 60

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode
        run: |
          # Xcode 16.0's actool on macos-15 fails with "No simulator runtime
          # version ... available to use with iphonesimulator SDK" when
          # compiling asset catalogs. Use the newest installed Xcode 16.x.
          ls -d /Applications/Xcode_*.app || true
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Build Kotlin/Native release framework
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: Prepare app icon (1024x1024)
        run: |
          ICON="iosApp/DtvApp/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          sips -z 1024 1024 "$ICON"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate
          echo "===== framework bundle layout ====="
          find ../shared/build/bin/iosArm64/releaseFramework -maxdepth 3 2>/dev/null | sort || true
          echo "===== any compose-resources artifacts ====="
          find ../shared/build -name "compose-resources*" 2>/dev/null | head -40 || true

      - name: Build app (no code signing)
        run: |
          set +e
          xcodebuild \
            -project iosApp/DtvMobile.xcodeproj \
            -scheme DtvMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | xcpretty
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "===== RAW ERRORS BELOW ====="
            grep -nE "error:|actool|Asset Catalog" "$RUNNER_TEMP/xcodebuild.log" | tail -80 || true
          fi
          exit $status

      - name: Locate .app product
        id: app
        run: |
          APP_PATH=$(find iosApp/build/Build/Products -maxdepth 2 -name "DtvMobile.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "DtvMobile.app not found" >&2
            find iosApp/build/Build/Products -maxdepth 3 || true
            exit 1
          fi
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          ls -la "$APP_PATH"
          if [ -d "$APP_PATH/compose-resources" ]; then
            echo "compose-resources present in app bundle"
          else
            echo "WARNING: compose-resources missing in app bundle" >&2
          fi

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          zip -qry DtvMobile-0.1.1-unsigned.ipa Payload
          ls -lh DtvMobile-0.1.1-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DtvMobile-0.1.1-unsigned-ipa
          path: DtvMobile-0.1.1-unsigned.ipa
          retention-days: 30
