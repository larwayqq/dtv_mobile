name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "ios**"

jobs:
  build-ipa:
    name: Build unsigned IPA (iOS arm64)
    runs-on: macos-15
    timeout-minutes: 60

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          xcodebuild -version

      - name: Build Kotlin/Native release framework
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: Prepare app icon (1024x1024)
        run: |
          ICON="iosApp/DtvApp/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          sips -z 1024 1024 "$ICON"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate

      - name: Build app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/DtvMobile.xcodeproj \
            -scheme DtvMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath iosApp/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | xcpretty

      - name: Locate .app product
        id: app
        run: |
          APP_PATH=$(find iosApp/build/Build/Products -maxdepth 2 -name "DtvMobile.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "DtvMobile.app not found" >&2
            find iosApp/build/Build/Products -maxdepth 3 || true
            exit 1
          fi
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"
          ls -la "$APP_PATH"
          if [ -d "$APP_PATH/compose-resources" ]; then
            echo "compose-resources present in app bundle"
          else
            echo "WARNING: compose-resources missing in app bundle" >&2
          fi

      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R "${{ steps.app.outputs.path }}" Payload/
          zip -qry DtvMobile-0.1.1-unsigned.ipa Payload
          ls -lh DtvMobile-0.1.1-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DtvMobile-0.1.1-unsigned-ipa
          path: DtvMobile-0.1.1-unsigned.ipa
          retention-days: 30
